[package]
name = "omarchy-random-wallpaper"
version = "0.1.0"
edition = "2024"
description = "A wallpaper rotator for Omarchy that only picks landscapes and city skylines, and never repeats itself"
license = "MIT"
repository = "https://github.com/windy664/omarchy-random-wallpaper"
keywords = ["omarchy", "wallpaper", "bing", "wikimedia", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "random-wallpaper"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
md-5 = "0.10"
rand = "0.9"
serde_json = "1"
ureq = "3"

[profile.release]
strip = true
lto = true
